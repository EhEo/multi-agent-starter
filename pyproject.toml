[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent-cli"
version = "2.0.0"
description = "CLI wrapper for the multi-agent-starter orchestration system generator"
requires-python = ">=3.8"

[project.scripts]
multiagent = "multiagent_cli:main"
mat = "mat_win:main"

[tool.setuptools]
py-modules = ["multiagent_cli", "mat_win"]
